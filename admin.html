<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Visitor Tracker - GoalPredict247 V7</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f0f0f] text-white p-4">
<div class="max-w-4xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-[20px] font-bold"><i class="fas fa-chart-line text-green-500"></i> Visitor Tracker - GoalPredict247 V7</h1>
    <a href="/" class="bg-[#1a1a1a] px-3 py-1.5 rounded-[4px] text-[12px]">HOME</a>
  </div>
  <div class="grid grid-cols-3 gap-3 mb-6">
    <div class="bg-[#1a1a1a] rounded-[6px] p-4 text-center"><p class="text-[11px] text-gray-400">TOTAL VISITS</p><p id="totalVisits" class="text-[24px] font-bold">0</p></div>
    <div class="bg-green-500/20 border border-green-500 rounded-[6px] p-4 text-center"><p class="text-[11px] text-gray-400">TODAY (<span id="todayDate"></span>)</p><p id="todayVisits" class="text-[24px] font-bold text-green-400">0</p></div>
    <div class="bg-[#1a1a1a] rounded-[6px] p-4 text-center"><p class="text-[11px] text-gray-400">API SAVED</p><p class="text-[14px] font-bold">1h refresh = 24 calls/day<br><span class="text-[10px] text-gray-400">Was 1,440/day at 60sec</span></p></div>
  </div>
  <div class="bg-[#1a1a1a] rounded-[6px] p-4 mb-6"><h2 class="font-bold text-[14px] mb-3">Last 7 Days</h2><div id="dailyStats" class="space-y-2"></div></div>
  <div class="bg-[#1a1a1a] rounded-[6px] p-4 mb-6"><h2 class="font-bold text-[14px] mb-3">Last 20 Visits</h2><div id="lastVisits" class="space-y-1.5 max-h-[400px] overflow-y-auto"></div></div>
</div>
<script>
async function loadStats(){
  const r = await fetch('/api/visit'); const j = await r.json();
  document.getElementById('totalVisits').textContent = j.total || 0;
  document.getElementById('todayVisits').textContent = j.today || 0;
  document.getElementById('todayDate').textContent = j.todayDate || '';
  const dailyDiv = document.getElementById('dailyStats');
  const entries = Object.entries(j.daily || {}).sort((a,b)=> b[0].localeCompare(a[0]));
  dailyDiv.innerHTML = entries.length===0? '<p class="text-[11px] text-gray-500">No data yet - visit homepage first</p>' : entries.slice(0,7).map(([date,count])=>`<div class="flex justify-between bg-[#0f0f0f] rounded-[4px] p-2.5"><span class="text-[11px] font-bold">${date}</span><span class="text-[11px] font-bold text-green-400">${count} visits</span></div>`).join('');
  const lastDiv = document.getElementById('lastVisits');
  lastDiv.innerHTML =!j.lastVisits||j.lastVisits.length===0? '<p class="text-[11px] text-gray-500">No visits yet</p>' : j.lastVisits.map(v=>`<div class="bg-[#0f0f0f] rounded-[4px] p-2 flex justify-between text-[10px]"><span class="text-gray-400">${v.time}</span><span class="font-bold">${v.page||'/'}</span><span class="text-gray-500">${v.ip}</span></div>`).join('');
}
loadStats(); setInterval(loadStats, 10000);
</script>
</body>
</html>
