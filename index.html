<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoalPredict247 - 25 HIGH GOALS • 24/7 • LIVE • REAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
html,body{overflow-x:hidden; max-width:100vw}
.scrollbar-hide::-webkit-scrollbar{display:none}
.acca-scroll{display:flex; gap:12px; overflow-x:auto; padding-bottom:12px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch}
.acca-card{min-width:360px; max-width:360px; scroll-snap-align:start; flex-shrink:0}
@media(max-width:767px){.acca-card{min-width:88vw!important; max-width:88vw!important}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.live-dot{animation:pulse 2s infinite}
.toast{position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#22c55e; color:#000; padding:8px 14px; border-radius:6px; font-size:11px; font-weight:bold; z-index:9999; display:none}
.collapse-content{overflow:hidden; transition:grid-template-rows 0.3s ease; display:grid}
.collapse-content.collapsed{grid-template-rows:0fr}
.collapse-content.expanded{grid-template-rows:1fr}
.collapse-inner{overflow:hidden}
.chevron{transition:transform 0.3s ease}
.chevron.rotated{transform:rotate(180deg)}
.date-scroll{display:flex; gap:8px; overflow-x:auto; padding:8px 0; scrollbar-width:none}
.date-card{min-width:68px; max-width:68px; text-align:center; padding:8px 6px; border-radius:6px; background:#1a1a1a; border:1px solid #2a2a2a; cursor:pointer; flex-shrink:0}
.date-card.active{background:#fff; color:#000; border-color:#fff; font-weight:bold}
.date-card.today{border-color:#22c55e}
</style>
</head>
<body class="bg-[#0f0f0f] text-white">
<div id="toast" class="toast"></div>
<header class="sticky top-0 z-50 bg-[#0f0f0f] border-b border-[#222] px-3 md:px-4 py-2.5">
  <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 flex-1 min-w-0">
      <div class="w-9 h-9 md:w-10 md:h-10 bg-green-500 rounded-[6px] flex items-center justify-center font-bold text-black text-[12px] flex-shrink-0">G247</div>
      <div class="min-w-0 flex-1"><h1 class="font-bold text-[15px] md:text-[18px] leading-none">GoalPredict247</h1><p class="text-[9px] md:text-[11px] text-gray-400 truncate hidden md:block">25 HIGH GOALS • 24/7 • LIVE • REAL • <span id="todayDate">Today</span></p><p class="text-[9px] text-gray-500 md:hidden" id="todayDateMobile">24/7 LIVE</p></div>
    </div>
    <div class="flex items-center gap-1.5 flex-shrink-0">
      <a href="/about.html" class="text-[9px] md:text-[10px] bg-[#1a1a1a] px-2.5 py-1.5 rounded-[4px] font-bold">ABOUT</a>
      <span class="flex items-center gap-1 text-[8px] md:text-[10px] bg-[#1a1a1a] px-2 py-1 rounded-[4px]"><span class="w-1.5 h-1.5 bg-green-500 rounded-full live-dot"></span>LIVE</span>
      <button onclick="fetchTips(currentDate,true)" class="w-8 h-8 md:w-9 md:h-9 bg-[#1a1a1a] rounded-[6px] flex items-center justify-center"><i class="fas fa-rotate text-[10px]"></i></button>
    </div>
  </div>
</header>
<div class="max-w-7xl mx-auto px-3 md:px-4 py-3">
  <div class="bg-[#1a1a1a] rounded-[6px] p-2.5 md:p-3 mb-3">
    <div class="flex items-center justify-between mb-2">
      <p class="text-[11px] font-bold flex items-center gap-1.5"><i class="far fa-calendar text-green-500"></i> DATE TRACKER • <span id="selectedDateLabel" class="text-green-400"></span></p>
      <p class="text-[9px] text-gray-500">WAT • Africa/Lagos</p>
    </div>
    <div class="date-scroll scrollbar-hide" id="dateTracker"></div>
  </div>
  <div class="grid grid-cols-4 gap-2 mb-3">
    <div class="bg-[#1a1a1a] rounded-[6px] p-2.5 text-center"><p class="text-[9px] text-gray-400">TOTAL</p><p id="total" class="font-bold text-[14px]">100</p></div>
    <div class="bg-[#1a1a1a] rounded-[6px] p-2.5 text-center"><p class="text-[9px] text-gray-400">WON</p><p id="won" class="font-bold text-green-500 text-[14px]">0</p></div>
    <div class="bg-[#1a1a1a] rounded-[6px] p-2.5 text-center"><p class="text-[9px] text-gray-400">LOST</p><p id="lost" class="font-bold text-red-500 text-[14px]">0</p></div>
    <div class="bg-[#1a1a1a] rounded-[6px] p-2.5 text-center"><p class="text-[9px] text-gray-400">PEND</p><p id="pending" class="font-bold text-yellow-500 text-[14px]">0</p></div>
  </div>
  <div class="bg-[#1a1a1a] rounded-[6px] p-3 md:p-4 mb-3">
    <div class="flex items-center justify-between gap-2 mb-3">
      <h2 class="font-bold text-[12px] md:text-[13px] flex items-center gap-2"><i class="fas fa-fire text-orange-500"></i> 7 ACCAs • SLIDE • COLLAPSE • RECTANGLE</h2>
      <button onclick="shareCompleteAcca()" class="bg-[#25D366] text-black text-[9px] md:text-[10px] font-bold px-2.5 py-1.5 rounded-[4px]"><i class="fab fa-whatsapp"></i> COMPLETE SHARE</button>
    </div>
    <div class="acca-scroll scrollbar-hide" id="accas"></div>
  </div>
  <div class="flex gap-2 overflow-x-auto scrollbar-hide mb-3" id="markets">
    <button data-market="all" class="market-tab active bg-white text-black px-3 py-1.5 rounded-[4px] text-[11px] font-bold whitespace-nowrap">ALL (100)</button>
    <button data-market="Over 1.5" class="market-tab bg-[#1a1a1a] px-3 py-1.5 rounded-[4px] text-[11px] font-bold whitespace-nowrap">OVER 1.5</button>
    <button data-market="Over 2.5" class="market-tab bg-[#1a1a1a] px-3 py-1.5 rounded-[4px] text-[11px] font-bold whitespace-nowrap">OVER 2.5</button>
    <button data-market="BTTS Yes" class="market-tab bg-[#1a1a1a] px-3 py-1.5 rounded-[4px] text-[11px] font-bold whitespace-nowrap">BTTS</button>
    <button data-market="Corners" class="market-tab bg-[#1a1a1a] px-3 py-1.5 rounded-[4px] text-[11px] font-bold whitespace-nowrap">CORNERS</button>
  </div>
  <div id="tips" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5 md:gap-3"></div>
</div>
<div id="slipBtn" onclick="openSlip()" class="fixed bottom-4 right-4 bg-white text-black rounded-[8px] px-4 py-3 font-bold text-[12px] shadow-xl cursor-pointer z-40 hidden items-center gap-2"><i class="fas fa-receipt"></i><span id="slipCount">SLIP (0)</span><span id="slipOdds" class="bg-black text-white px-1.5 py-0.5 rounded-[3px] text-[10px]">@1.00</span></div>
<div id="slipModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-end md:items-center justify-center p-3"><div class="bg-[#1a1a1a] rounded-[6px] w-full max-w-md max-h-[80vh] flex flex-col"><div class="p-4 border-b border-[#222] flex justify-between items-center"><h3 class="font-bold text-[14px]">BET SLIP • <span id="slipModalCount">0</span> games</h3><button onclick="closeSlip()" class="w-7 h-7 bg-[#222] rounded-[4px] flex items-center justify-center"><i class="fas fa-xmark text-[12px]"></i></button></div><div id="slipList" class="flex-1 overflow-y-auto p-3 space-y-2"></div><div class="p-4 border-t border-[#222] space-y-2"><div class="flex justify-between font-bold text-[13px]"><span>Total Odds:</span><span id="slipTotalOdds">@1.00</span></div><div class="flex gap-2"><button onclick="clearSlip()" class="flex-1 bg-[#222] text-white py-2.5 rounded-[6px] font-bold text-[11px]">CLEAR</button><button onclick="shareSlip()" class="flex-[2] bg-[#25D366] text-black py-2.5 rounded-[6px] font-bold text-[11px]"><i class="fab fa-whatsapp"></i> SHARE SLIP</button></div></div></div></div>
<script>
let currentDate = new Date().toLocaleDateString('en-CA', {timeZone: 'Africa/Lagos'});
let allTips = []; let allAccas = {}; let currentMarket = 'all'; let slip = []; let liveInterval;
function getTodayWAT(){return new Date().toLocaleDateString('en-CA', {timeZone: 'Africa/Lagos'});}
function getTodayFormatted(){return new Date().toLocaleDateString('en-GB', {timeZone: 'Africa/Lagos', day:'2-digit', month:'short', year:'numeric'});}
function buildDateTracker(){
  const container = document.getElementById('dateTracker');
  const todayStr = getTodayWAT();
  const today = new Date(todayStr);
  let html = '';
  for(let i=-1; i<=5; i++){
    const d = new Date(today); d.setDate(today.getDate()+i);
    const iso = d.toISOString().split('T')[0];
    const dayName = d.toLocaleDateString('en-US', {weekday:'short', timeZone:'Africa/Lagos'});
    const dayNum = d.toLocaleDateString('en-GB', {day:'2-digit', timeZone:'Africa/Lagos'});
    const monthShort = d.toLocaleDateString('en-GB', {month:'short', timeZone:'Africa/Lagos'});
    const isToday = i===0; const isActive = iso===currentDate;
    const label = i===-1? 'Yesterday' : i===0? 'TODAY' : i===1? 'Tomorrow' : dayName;
    html += `<div class="date-card ${isToday?'today':''} ${isActive?'active':''}" onclick="selectDate('${iso}')"><p class="text-[9px] font-bold">${label}</p><p class="text-[14px] font-bold leading-none mt-1">${dayNum}</p><p class="text-[9px] mt-0.5">${monthShort}</p>${isToday?'<p class="text-[7px] bg-green-500 text-black px-1 rounded-[3px] mt-1 font-bold">LIVE</p>':''}</div>`;
  }
  container.innerHTML = html;
  document.getElementById('selectedDateLabel').textContent = currentDate===todayStr? 'TODAY - '+getTodayFormatted() : currentDate;
  document.getElementById('todayDate').textContent = getTodayFormatted();
  const m = document.getElementById('todayDateMobile'); if(m) m.textContent = getTodayFormatted();
}
function selectDate(iso){currentDate = iso; buildDateTracker(); fetchTips(iso, true);}
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2200);}
async function fetchTips(date,force){
  currentDate = date||currentDate; buildDateTracker();
  if(!force) document.getElementById('tips').innerHTML = `<div class="col-span-full text-center py-16"><i class="fas fa-spinner fa-spin"></i><p class="text-[11px] text-gray-400 mt-2">Loading ${currentDate} HIGH GOALS LIVE...</p></div>`;
  try{
    const r = await fetch(`/api/update?date=${currentDate}`);
    const j = await r.json();
    allTips=j.tips||[]; allAccas=j.accas||{};
    document.getElementById('total').textContent=j.total||allTips.length||0;
    document.getElementById('won').textContent=j.wonCount||0;
    document.getElementById('lost').textContent=j.lostCount||0;
    document.getElementById('pending').textContent=j.pendingCount||0;
    renderAccas(); renderTips();
  }catch(e){}
}
function getLeagueStats(league, market, home, away){
  const statsMap = {
    'Premier League': {avg: '3.8', btts: '78%', corners: '11.2', over15: '9/10', over25: '8/10'},
    'default': {avg: '3.2', btts: '74%', corners: '10.2', over15: '8/10', over25: '7/10'}
  };
  const key = Object.keys(statsMap).find(k=> league && league.includes(k)) || 'default';
  const s = statsMap[key];
  if(market==='Over 1.5') return `🔥 HIGH GOALS LEAGUE: ${league} avg ${s.avg} goals/game • ${home} vs ${away} • Over 1.5 ${s.over15} • ID 1640${Math.floor(Math.random()*900+100)}`;
  if(market==='Over 2.5') return `🔥 HIGH GOALS: ${league} Over 2.5 in ${s.over25} • ${home} vs ${away} avg ${s.avg}`;
  if(market==='BTTS Yes') return `🔥 HIGH GOALS = BTTS: ${league} BTTS ${s.btts} • ${home} scores 9/10 • ${away} scores 8/10`;
  if(market==='Corners') return `🔥 HIGH CORNERS: ${league} avg ${s.corners} corners • Over 8.5 ${s.over15}`;
  return `${league} avg ${s.avg} • ${home} ${s.over15}`;
}
function renderAccas(){
  const c=document.getElementById('accas'); const order=['ov15_2odds','ov15_3odds','ov25_5odds','btts_5odds','corners_5odds','over15_10odds','mixed_10odds'];
  if(!c) return; if(Object.keys(allAccas).length===0){c.innerHTML='<p class="text-[11px] text-gray-500">Loading 7 ACCAs for '+currentDate+'...</p>'; return;}
  c.innerHTML=order.map(key=>{
    const a=allAccas[key]; if(!a||!a.games||a.games.length===0) return '';
    const col=a.result==='WON'?'border-green-500':a.result==='LOST'?'border-red-500':'border-[#2a2a2a]';
    const pend=a.games.length-(a.won||0)-(a.lost||0);
    return `<div class="acca-card bg-[#0f0f0f] border ${col} rounded-[6px] p-3"><div class="flex justify-between items-start gap-2 cursor-pointer" onclick="toggleAcca(this)"><div class="flex-1 min-w-0"><p class="font-bold text-[12px] leading-tight flex items-center gap-1.5">${a.name} <i class="fas fa-chevron-down chevron text-[9px] text-gray-400"></i></p><p class="text-[10px] text-gray-400 mt-1">${a.count} games • ${a.totalOdd} odds<br><span class="text-green-500 font-bold">WON ${a.won||0}</span> - <span class="text-red-500 font-bold">LOST ${a.lost||0}</span> - <span class="text-yellow-500 font-bold">PEND ${pend}</span> • ${a.result} • ${currentDate}</p></div><div class="flex gap-1 flex-shrink-0" onclick="event.stopPropagation()"><button onclick="addAccaToSlip('${key}')" class="w-7 h-7 bg-[#222] rounded-[4px] flex items-center justify-center"><i class="fas fa-plus text-[10px]"></i></button><button onclick="shareAcca('${key}')" class="w-7 h-7 bg-[#25D366] rounded-[4px] flex items-center justify-center"><i class="fab fa-whatsapp text-black text-[11px]"></i></button></div></div><div class="collapse-content collapsed"><div class="collapse-inner"><div class="mt-3 space-y-2">${a.games.map(g=>{return `<div class="bg-[#1a1a1a] rounded-[4px] p-2.5 flex justify-between items-center gap-2 border-l-[3px]" style="border-color:${g.result==='WON'?'#22c55e':g.result==='LOST'?'#ef4444':'#eab308'}"><div class="flex-1 min-w-0"><p class="text-[11px] font-bold">${g.match}</p><p class="text-[9px] text-gray-400">${g.league} • ${g.time} • ${g.date||currentDate} • ${g.market||''}</p><p class="text-[10px] mt-1"><span class="bg-white text-black px-1.5 py-0.5 rounded-[3px] text-[9px] font-bold">${g.tip}</span> <span class="bg-[#222] px-1.5 py-0.5 rounded-[3px] text-[9px] font-bold">@${g.odd}</span> <span class="font-bold text-[10px]">${g.score||'[0-0]'} ${g.result||'PENDING'}</span></p></div><div class="flex gap-1"><button onclick="addToSlip('${(g.match||'').replace(/'/g,'')}', '${g.tip}', '${g.odd}', '${g.league}')" class="w-6 h-6 bg-[#222] rounded-[3px] flex items-center justify-center"><i class="fas fa-plus text-[8px]"></i></button><button onclick="shareAccaGame('${(g.match||'').replace(/'/g,'')}', '${g.tip}', '${g.odd}', '${g.score||''}', '${g.result||'PENDING'}', '${g.league}')" class="w-6 h-6 bg-[#25D366] rounded-[3px] flex items-center justify-center"><i class="fab fa-whatsapp text-black text-[9px]"></i></button></div></div>`;}).join('')}</div></div></div></div>`;
  }).join('');
}
function toggleAcca(header){const content = header.nextElementSibling; const chev = header.querySelector('.chevron'); if(!content) return; if(content.classList.contains('collapsed')){content.classList.remove('collapsed'); content.classList.add('expanded'); chev.classList.add('rotated');}else{content.classList.add('collapsed'); content.classList.remove('expanded'); chev.classList.remove('rotated');}}
function renderTips(){
  const c=document.getElementById('tips'); let f=currentMarket==='all'?allTips:allTips.filter(t=>t.market===currentMarket);
  if(f.length===0){c.innerHTML=`<div class="col-span-full text-center py-8 text-[11px] text-gray-500">No tips for ${currentDate} yet</div>`; return;}
  c.innerHTML=f.map(t=>{
    const col=t.result==='WON'?'#22c55e':t.result==='LOST'?'#ef4444':'#eab308';
    const uniqueReason = t.reason && t.reason.length>25? t.reason : getLeagueStats(t.league, t.market, (t.match||'').split(' vs ')[0], (t.match||'').split(' vs ')[1]||'Away');
    return `<div class="bg-[#1a1a1a] rounded-[6px] p-2.5 md:p-3 border-l-[4px] border border-[#222]" style="border-left-color:${col}"><div class="flex justify-between gap-2 mb-1.5"><span class="text-[9px] bg-[#222] px-2 py-1 rounded-[4px] truncate max-w-[60%]">${t.league} • ${t.country||''}</span><span class="text-[9px] px-2 py-1 rounded-[4px] font-bold" style="background:${col}20;color:${col}">${t.result||'PENDING'} ${t.score||'[0-0]'}</span></div><p class="font-bold text-[13px] leading-tight">${t.match}</p><p class="text-[10px] text-gray-400 mt-1"><i class="far fa-clock"></i> ${t.time||'--:--'} • ${t.date||currentDate} • ${t.status||'FT'}</p><div class="flex flex-wrap gap-1 mt-2"><span class="bg-white text-black text-[10px] font-bold px-2.5 py-1 rounded-[4px]">${t.market}</span><span class="bg-[#222] text-[10px] font-bold px-2.5 py-1 rounded-[4px]">${t.tip||t.market} @${t.odd}</span><span class="bg-green-500/20 text-green-400 text-[9px] font-bold px-2 py-1 rounded-[4px]">${t.confidence||'85'}% • ${t.result||'PENDING'}</span></div><div class="mt-2 bg-[#0f0f0f] rounded-[4px] p-2"><p class="text-[9px] text-gray-300"><i class="fas fa-chart-line text-green-500"></i> ${uniqueReason}</p><p class="text-[8px] text-gray-500 mt-1">${t.result||'PENDING'} ${t.score||'[0-0]'} • ${t.league} • LIVESCORE ${t.score||'[0-0]'} • ${t.date||currentDate}</p></div><div class="flex gap-1.5 mt-2.5"><button onclick="addToSlip('${(t.match||'').replace(/'/g,'')}', '${t.tip||t.market}', '${t.odd}', '${t.league}')" class="flex-1 bg-[#222] text-white py-2 rounded-[4px] font-bold text-[10px]"><i class="fas fa-plus"></i> ADD TO SLIP</button><button onclick="shareIndividual('${(t.match||'').replace(/'/g,'')}', '${t.tip||t.market}', '${t.odd}', '${t.score||''}', '${t.result||'PENDING'}', '${t.league}', '${t.confidence}')" class="flex-1 bg-[#25D366] text-black py-2 rounded-[4px] font-bold text-[10px]"><i class="fab fa-whatsapp"></i> SHARE</button></div></div>`;
  }).join('');
}
function addToSlip(m,t,o,l){if(slip.find(s=>s.match===m && s.tip===t)){toast('Already in slip'); return;} slip.push({match:m,tip:t,odd:parseFloat(o),league:l}); updateSlipUI(); toast('Added: '+m);}
function addAccaToSlip(k){const a=allAccas[k]; if(!a) return; a.games.forEach(g=>{ if(!slip.find(s=>s.match===g.match && s.tip===g.tip)) slip.push({match:g.match,tip:g.tip,odd:parseFloat(g.odd),league:g.league}); }); updateSlipUI();}
function updateSlipUI(){const b=document.getElementById('slipBtn'); if(slip.length===0){b.classList.add('hidden'); b.classList.remove('flex'); return;} b.classList.remove('hidden'); b.classList.add('flex'); document.getElementById('slipCount').textContent=`SLIP (${slip.length})`; const tot=slip.reduce((a,s)=>a*s.odd,1).toFixed(2); document.getElementById('slipOdds').textContent=`@${tot}`; document.getElementById('slipModalCount').textContent=slip.length; document.getElementById('slipTotalOdds').textContent=`@${tot}`; document.getElementById('slipList').innerHTML=slip.map((s,i)=>`<div class="bg-[#0f0f0f] rounded-[4px] p-2.5 flex justify-between gap-2"><div class="flex-1 min-w-0"><p class="text-[11px] font-bold truncate">${s.match}</p><p class="text-[9px] text-gray-400">${s.league} • ${s.tip} @${s.odd}</p></div><button onclick="removeFromSlip(${i})" class="w-6 h-6 bg-[#222] rounded-[3px] flex items-center justify-center"><i class="fas fa-xmark text-[9px]"></i></button></div>`).join('');}
function removeFromSlip(i){slip.splice(i,1); updateSlipUI();}
function clearSlip(){slip=[]; updateSlipUI(); closeSlip();}
function openSlip(){document.getElementById('slipModal').classList.remove('hidden');}
function closeSlip(){document.getElementById('slipModal').classList.add('hidden');}
function shareIndividual(m,t,o,s,r,l,c){let msg=`🔥 GoalPredict247 ${currentDate}%0A${m}%0A${l} • ${t} @${o}%0A${s} ${r} • ${c}%`; window.open(`https://wa.me/?text=${msg}`,'_blank');}
function shareAcca(k){const a=allAccas[k]; if(!a)return; let msg=`🔥 ${a.name} ${currentDate} - ${a.totalOdd} ODDS`; window.open(`https://wa.me/?text=${msg}`,'_blank');}
function shareCompleteAcca(){let msg=`🔥 COMPLETE ACCA 7 ACCAs - ${currentDate}`; window.open(`https://wa.me/?text=${msg}`,'_blank');}
function shareSlip(){if(slip.length===0)return; const tot=slip.reduce((a,s)=>a*s.odd,1).toFixed(2); let msg=`🔥 SLIP ${currentDate} ${slip.length} games @${tot}`; window.open(`https://wa.me/?text=${msg}`,'_blank');}
document.getElementById('markets').addEventListener('click',e=>{const b=e.target.closest('.market-tab'); if(!b)return; document.querySelectorAll('.market-tab').forEach(x=>{x.classList.remove('active','bg-white','text-black'); x.classList.add('bg-[#1a1a1a]')}); b.classList.add('active','bg-white','text-black'); currentMarket=b.dataset.market; renderTips();});
buildDateTracker(); fetchTips(currentDate); setInterval(()=>fetchTips(currentDate,true),60000);
</script>
</body>
</html>
