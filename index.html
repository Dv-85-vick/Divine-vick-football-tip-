<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DIVINE-VIC FOOTBALL TIPS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0e0e0e;color:#d9d9d9;font-family:system-ui;padding-bottom:90px}
.header{display:flex;align-items:center;gap:14px;padding:16px;background:#111;border-bottom:1px solid #222}
.dv{width:56px;height:56px;border-radius:50%;border:2px solid #ffcc00;display:flex;align-items:center;justify-content:center;color:#ffcc00;font-weight:800;font-size:22px;background:#1a1a00}
.sub{color:#888;font-size:13px;margin-top:4px}
.stats{display:flex;gap:12px;padding:14px}
.stat{flex:1;background:#171717;border:1px solid #252525;border-radius:14px;padding:12px}
.stat b{font-size:22px;color:#fff}
.acca-card{background:#151515;border:1px solid #222;border-radius:16px;margin:14px;overflow:hidden}
.acca-head{display:flex;justify-content:space-between;padding:12px 14px;background:#1a1a1a;border-bottom:1px solid #222}
.badge{background:#f5f5f5;color:#111;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700}
.game-row{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #1e1e1e;gap:10px}
.g-name{font-weight:700;color:#fff;font-size:14px}.g-meta{color:#888;font-size:12px;margin-top:3px}
.btn{border:0;border-radius:20px;padding:7px 12px;font-weight:700;font-size:12px;cursor:pointer;background:#fff;color:#111}
.betbar{position:fixed;bottom:0;left:0;right:0;background:#151515;border-top:1px solid #222;display:flex;justify-content:space-between;padding:10px 12px}
</style>
</head>
<body>
<div class="header"><div class="dv">DV</div><div><div style="font-weight:800">DIVINE-VIC<br><span style="color:#ffcc00">FOOTBALL TIPS</span></div><div class="sub">Over Market Specialist • 10 Leagues High Goals + Corners</div></div></div>
<div class="stats"><div class="stat"><b id="tipCount">40</b><br><small id="tipDate">Tips</small></div><div class="stat"><b style="color:#2ecc71">0W -</b><br><small>Win Rate</small></div></div>
<div style="padding:18px 16px 8px"><h2 style="font-size:18px">🔥 TODAY'S 10 ODDS ACCAS</h2><p style="color:#666;font-size:13px">5 Expert Accumulators • Share + Add to Slip</p></div>
<div id="accas"></div>
<script>
async function load(){
  const r=await fetch('/api/update'); const data=await r.json();
  document.getElementById('tipCount').textContent=data.tips?.length||40;
  document.getElementById('tipDate').textContent=(data.date||'')+' Tips';
  const titles={over15:'10 ODDS - Over 1.5',over25:'10 ODDS - Over 2.5',mix:'10 ODDS - Mix',team15:'10 ODDS - Team Over 1.5',corners:'10 ODDS - Corners'};
  let html='';
  for(const k of Object.keys(data.accas||{})){
    const acca=data.accas[k]; const total=acca.totalOdd;
    html+=`<div class="acca-card"><div class="acca-head"><strong>🔥 ${titles[k]||k}</strong><span class="badge">${total} ODD • ${acca.games.length} GAMES</span></div>`;
    acca.games.forEach(g=>{
      const name=g.match||`${g.home||''} vs ${g.away||''}`;
      html+=`<div class="game-row"><div><div class="g-name">${name}</div><div class="g-meta">${g.tip} @${g.odd}</div></div><div style="display:flex;gap:8px"><button class="btn" onclick="navigator.share?navigator.share({text:'${name} - ${g.tip} @${g.odd}'}):alert('Copied')">Share</button><button class="btn" onclick="addSlip('${name}','${g.tip}','${g.odd}')">+Slip</button></div></div>`;
    });
    html+=`</div>`;
  }
  document.getElementById('accas').innerHTML=html;
}
let slip=[];function addSlip(m,t,o){slip.push({m,t,o:parseFloat(o)});const total=slip.reduce((a,b)=>a*b.o,1).toFixed(2);document.getElementById('slipCount').textContent=slip.length;document.getElementById('slipOdd').textContent='@'+total;}
load();
</script>
<div class="betbar"><div style="display:flex;gap:10px;align-items:center"><div id="slipCount" style="width:40px;height:40px;border-radius:50%;background:#222;display:flex;align-items:center;justify-content:center;font-weight:800">0</div><div><div style="font-weight:800">BET SLIP <span id="slipOdd" style="background:#222;padding:2px 8px;border-radius:12px;font-size:12px">@0.00</span></div><div style="color:#777;font-size:12px">Add tips to build 10 odds</div></div></div><button class="btn">SHARE</button></div>
</body>
</html>
