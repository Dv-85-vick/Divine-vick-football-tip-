<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIVINE-VICK-FOOTBALL-TIPS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e5e5e5;font-family:Inter,sans-serif;padding-bottom:90px}
header{background:#111;border-bottom:1px solid #222;padding:10px 12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:20}
.logo{width:36px;height:36px;background:#ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-weight:800}
.h-title{font-weight:800;font-size:13px}.h-sub{font-size:10px;color:#888}
.date-bar{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#0f0f0f;border-bottom:1px solid #222;scrollbar-width:none}
.date-bar::-webkit-scrollbar{display:none}
.date-chip{min-width:84px;background:#151515;border:1px solid #222;border-radius:12px;padding:8px;text-align:center;cursor:pointer;flex-shrink:0}
.date-chip.active{background:#ffcc00;border-color:#ffcc00;color:#000}
.date-chip b{display:block;font-size:11px}.date-chip span{font-size:9px;display:block;margin-top:2px}
.date-chip.d-win{font-size:9px;margin-top:3px;color:#22c55e;font-weight:700}.date-chip.active.d-win{color:#000}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px}
.stat{background:#151515;border:1px solid #222;border-radius:12px;padding:10px;text-align:center}
.stat b{font-size:18px;display:block}.stat span{font-size:10px;color:#888}
.accas{padding:0 10px 10px}.acca{background:#151515;border:1px solid #222;border-radius:16px;margin-bottom:12px;overflow:hidden}
.acca-head{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;border-bottom:1px solid #222;gap:6px;flex-wrap:wrap}
.badge{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-pending{background:#e5e5e5;color:#000}.badge-won{background:#22c55e;color:#000}.badge-lost{background:#ef4444;color:#fff}
.a-game{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #1e1e1e}
.tips{padding:0 10px}.g-card{background:#151515;border:1px solid #222;border-radius:14px;padding:12px;margin-bottom:10px}
.btn{padding:6px 10px;border-radius:20px;border:1px solid #333;background:#e5e5e5;color:#000;font-size:11px;font-weight:600;cursor:pointer}
.btn.dark{background:#222;color:#ddd}.bet-slip{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;z-index:30}
</style>
</head><body>
<header><div class="logo">DV</div><div><div class="h-title">DIVINE-VICK FOOTBALL TIPS</div><div class="h-sub">divine-vick-football-tips • Date History • Win/Loss Tracker</div></div></header>

<div class="date-bar" id="dateBar"></div>

<div class="stats">
<div class="stat"><b id="totalTips">0</b><span id="dateLabel">Tips</span></div>
<div class="stat"><b id="winCount" style="color:#22c55e">0 WON</b><span id="lostCount">0 LOST</span></div>
<div class="stat"><b id="pendingCount">0</b><span>Pending Today</span></div>
</div>

<div class="accas" id="accas"></div>
<div class="tips"><div id="tips"></div></div>

<div class="bet-slip"><div><b>BET SLIP <span id="slipOdd">@0.00</span></b> <span id="slipCount">0</span></div><button onclick="shareSlip()" style="background:#e5e5e5;border:none;padding:8px 16px;border-radius:20px;font-weight:700">SHARE</button></div>

<script>
let allTips=[], accasData={}, slip=[], currentDate='';
async function load(dateStr){
  const url = dateStr? `/api/update?date=${dateStr}` : '/api/update';
  const r=await fetch(url); const data=await r.json();
  allTips=data.tips||[]; accasData=data.accas||{}; currentDate=data.date;
  document.getElementById('totalTips').textContent=data.total;
  document.getElementById('dateLabel').textContent=data.date;
  document.getElementById('winCount').textContent=data.wonCount+' WON';
  document.getElementById('lostCount').textContent=data.lostCount+' LOST • '+data.winRate+'%';
  document.getElementById('pendingCount').textContent=data.pendingCount+' Pending';
  renderDateBar(data.dates||[], data.date);
  renderAccas(); renderTips();
}
function renderDateBar(dates, activeDate){
  const bar=document.getElementById('dateBar');
  if(dates.length===0){
    // fallback generate 10 days
    dates=[]; for(let i=-3;i<=6;i++){const d=new Date();d.setDate(d.getDate()+i);const ds=d.toISOString().split('T')[0];const lab=i===0?"TODAY":i===-1?"YESTERDAY":i===1?"TOMORROW":d.toLocaleDateString('en',{month:'short',day:'numeric'});dates.push({date:ds,label:lab,isToday:i===0});}
  }
  bar.innerHTML=dates.map(d=>`
    <div class="date-chip ${d.date===activeDate?'active':''}" onclick="load('${d.date}')">
      <b>${d.label}</b>
      <span>${d.date.slice(5)}</span>
      <div class="d-win">${d.date===activeDate? (document.getElementById('winCount').textContent) : 'Click to view'}</div>
    </div>
  `).join('');
}
function renderAccas(){
  const c=document.getElementById('accas'); c.innerHTML='';
  Object.entries(accasData).forEach(([k,a])=>{
    if(!a.games) return;
    const div=document.createElement('div'); div.className='acca';
    div.innerHTML=`<div class="acca-head"><b>${k.toUpperCase()} • ${a.totalOdd} ODD • ${a.count} GAMES</b><span class="badge ${a.result==='WON'?'badge-won':a.result==='LOST'?'badge-lost':'badge-pending'}">${a.result} ${a.won||0}W-${a.lost||0}L</span></div>
      ${a.games.map(g=>`<div class="a-game"><div>${g.match} [${g.score||''}] ${g.tip} @${g.odd} • ${g.result}</div><button class="btn dark" onclick="addSlip(${g.id})">+Slip</button></div>`).join('')}`;
    c.appendChild(div);
  });
}
function renderTips(){
  document.getElementById('tips').innerHTML=allTips.map(t=>`
    <div class="g-card"><div style="display:flex;justify-content:space-between;font-size:10px;color:#888"><span>${t.league} • ${t.time}</span><span style="color:${t.resultColor};font-weight:800">${t.result} ${t.score||''}</span></div>
    <div style="font-weight:700;margin:6px 0">${t.match}</div><div>Tip: <b style="color:#ffcc00">${t.tip}</b> @${t.odd} • ${t.confidence}%</div>
    <div style="margin-top:8px;display:flex;gap:6px"><button class="btn" onclick="shareG('${t.match}','${t.tip}','${t.odd}','${t.result}','${t.score||''}')">Share ${t.result}</button><button class="btn dark" onclick="addSlip(${t.id})">+Slip</button></div></div>
  `).join('');
}
function addSlip(id){const t=allTips.find(x=>x.id===id); if(!t||slip.find(s=>s.id===id)) return; slip.push(t); document.getElementById('slipCount').textContent=slip.length; document.getElementById('slipOdd').textContent='@'+slip.reduce((a,b)=>a*parseFloat(b.odd),1).toFixed(2);}
function shareG(m,tip,odd,res,sc){const txt=`${res==='WON'?'✅':res==='LOST'?'❌':'⏳'} ${m} ${sc} | ${tip} @${odd} • ${res}\n${location.origin}`; navigator.clipboard.writeText(txt); alert('Copied!');}
function shareSlip(){const tot=slip.reduce((a,b)=>a*parseFloat(b.odd),1).toFixed(2); const txt=`🔥 ${tot} ODD ACCA\n${slip.map(s=>`${s.match} ${s.tip} @${s.odd} • ${s.result}`).join('\n')}\n${location.origin}`; navigator.clipboard.writeText(txt); alert('Slip copied!');}
load();
</script>
</body></html>
